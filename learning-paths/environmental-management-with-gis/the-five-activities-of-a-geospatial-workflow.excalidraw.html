<text font-family="Virgil, Segoe UI Emoji, sans-serif" font-size="28" fill="var(--excalidraw-color-2f9e44, #2f9e44)" text-anchor="start" dominant-baseline="auto"><tspan x="3773.23" y="2675.79">The three preceding phases are conducted without committing to any</tspan><tspan x="3773.23" y="2710.79">software or storage format. Recording is the act of giving the</tspan><tspan x="3773.23" y="2745.79">formalised Domain of Discourse a physical, digital shape: a spatial</tspan><tspan x="3773.23" y="2780.79">table whose geometry type, field names and field types faithfully</tspan><tspan x="3773.23" y="2815.79">carry the discrete/continuous character, thematic specification, MMU,</tspan><tspan x="3773.23" y="2850.79">typing and topological constraints - and whose coordinate reference</tspan><tspan x="3773.23" y="2885.79">system is fit for whatever the Analytical Schema will actually do.</tspan><tspan x="3773.23" y="2920.79"></tspan><tspan x="3773.23" y="2955.79">Recording happens twice over: once for Realisations re-evaluated from</tspan><tspan x="3773.23" y="2990.79">Phase 1, and again for Realisations validated at Phase 3. Both</tspan><tspan x="3773.23" y="3025.79">converge on the same schema - the practitioner should not be able to</tspan><tspan x="3773.23" y="3060.79">tell, from the finished table, whether a row was transformed from a</tspan><tspan x="3773.23" y="3095.79">register or digitised from a field observation.</tspan></text>
